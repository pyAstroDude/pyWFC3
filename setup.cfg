[metadata]
name = pyWFC3
version = 1.0.0-beta
url = https://github.com/pyAstroDude/pyWFC3
author = Sachindev Shenoy
author_email = "Sachindev Shenoy" <sachin.4m.stsci@gmail.com>
description = Collection of functions and class to facilitate WfC3 data reduction and analysis.
long_description = file:README.md
license = MIT
license_file = LICENSE
classifier =
    "License :: OSI Approved :: MIT License"

[options]
package_dir =
    =src
packages = find:
include_package_data = True
install_requires =
	astropy>=6.1
	numpy>=2.2
	pandas>=2.2
	pyds9>=1.8
	PyQt5
	scipy
	astroquery
	crds
	wfc3tools
	
[options.packages.find]
where = src
exclude =
    test*

[options.package_data]
pywfc3 = parameters/*.yaml, data/*.fits

[options.entry_points]
console_scripts =
    select_data = pywfc3.gui.select_data:main
    make_dflat = pywfc3.flats.make_dflat:main
